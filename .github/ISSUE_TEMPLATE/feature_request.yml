name: Feature request
description: Propose a focused protocol improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the recovery or checkpointing problem without assuming a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain effects on schema compatibility, CAS, fencing, and uncertain outcomes.
    validations:
      required: true
